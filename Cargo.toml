[package]
name = "price-parser-rust"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
authors = ["DevThreads"]
license = "BSD-3-Clause"
description = "Behavior-focused Rust port of scrapinghub/price-parser"
repository = "https://github.com/AshokGadde/price-parser-rust"

[dependencies]
once_cell = "=1.19.0"
regex = "=1.10.4"
rust_decimal = "=1.35.0"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"

[[bin]]
name = "price-parser"
path = "src/bin/price-parser.rs"
